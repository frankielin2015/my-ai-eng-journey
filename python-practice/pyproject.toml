[project]
name = "python-practice"
version = "0.1.0"
description = "A TDD-style Python practice gym for a backend engineer learning Python."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[[tool.uv.index]]
name = "walmart"
url = "https://pypi.ci.artifacts.walmart.com/artifactory/api/pypi/external-pypi/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
